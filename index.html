<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Desk - New Ticket</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand-block" href="index.html">
      <span class="brand-mark">S</span>
      <span>
        <span class="eyebrow">Support portal</span>
        <strong>Support Desk</strong>
      </span>
    </a>

    <a class="button button-secondary" href="ticket.html">
      Check existing tickets
    </a>
  </header>

  <main class="page-shell">
    <section class="hero-card">
      <div>
        <span class="eyebrow">Customer support</span>
        <h1>How can we help?</h1>
        <p>
          Submit a new support request and track updates through the ticket portal.
        </p>
      </div>
    </section>

    <section class="main-grid">
      <form id="support-form" class="card form-card">
        <div class="section-heading">
          <span class="eyebrow">New ticket</span>
          <h2>Request details</h2>
          <p>Fields marked with * are required.</p>
        </div>

        <div class="form-grid">
          <label>
            <span>Name *</span>
            <input type="text" name="requester" required>
          </label>

          <label>
            <span>Email *</span>
            <input type="email" name="email" required>
          </label>

          <label>
            <span>Phone number *</span>
            <input type="tel" name="phone" required>
          </label>

          <label>
            <span>Company</span>
            <input type="text" name="company">
          </label>

          <label>
            <span>Category *</span>
            <select name="category" required>
              <option value="">Select a category</option>
              <option>Account access</option>
              <option>Billing</option>
              <option>Technical issue</option>
              <option>Feature request</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            <span>Priority *</span>
            <select name="priority" required>
              <option value="">Select a priority</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </label>

          <label class="full-width">
            <span>Issue summary *</span>
            <input type="text" name="summary" required>
          </label>

          <label class="full-width">
            <span>Issue details *</span>
            <textarea name="details" rows="7" required></textarea>
          </label>
        </div>

        <div class="action-row">
          <button class="button button-primary" type="submit">
            Submit request
          </button>

          <a class="button button-secondary" href="ticket.html">
            Check existing tickets
          </a>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js?v=20260923-2"></script>
</body>
</html>
