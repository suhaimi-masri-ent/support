name: Support request
description: Manually submit a support ticket.
title: "[Support] "
labels:
  - support

body:

  - type: markdown
    attributes:
      value: |
        Please provide the information below.
        Do not include passwords, API keys, tokens, or other secrets.

  - type: input
    id: requester
    attributes:
      label: Requester name
      description: Who is contacting support?
      placeholder: Jane Smith
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email address
      description: Best email for contacting the requester.
      placeholder: jane@company.com
    validations:
      required: true

  - type: input
    id: company
    attributes:
      label: Company or team
      placeholder: Northwind Co

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Account access
        - Billing
        - Technical issue
        - Feature request
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Urgent
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Password reset loop in the admin portal
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Problem details
      description: Describe the issue, steps to reproduce, and impact.
      placeholder: |
        Please provide relevant context, screenshots,
        error messages, and timing details.
    validations:
      required: true
